# Local stack: app + Postgres + Redis (+ Upstash-compatible REST proxy).
# Usage:  docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ro
      POSTGRES_PASSWORD: ro
      POSTGRES_DB: ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ro"]
      interval: 3s
      retries: 20
    ports: ["5433:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Speaks the Upstash REST protocol on top of plain Redis so the app's
  # @upstash/redis client works unchanged against a local Redis.
  redis-rest:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://ro:ro@postgres:5432/ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    environment:
      DATABASE_URL: postgresql://ro:ro@postgres:5432/ro
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: local-dev-token
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-rest: { condition: service_started }
    ports: ["3100:3000"]
